  窓と同じ 2 段の枠（外 2px が明るい白の 60%、内 2px がその 45%）を四辺に引き、その内側に 2px の暗い帯（立体感）。地は紺の縦のグラデーションを 85% で透かす。
  TextAdventure.uss が 9-slice（左 10 / 右 18 / 上 10 / 下 10）で名前の長さに伸ばす。
  PNG への変換（このディレクトリで実行）: magick -background none Nameplate.svg PNG32:Nameplate.png
-->
