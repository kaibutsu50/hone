  <path d="M8 2 H56 A6 6 0 0 1 62 8 V88 A6 6 0 0 1 56 94 H8 A6 6 0 0 1 2 88 V8 A6 6 0 0 1 8 2 Z M8 4 H56 A4 4 0 0 1 60 8 V88 A4 4 0 0 1 56 92 H8 A4 4 0 0 1 4 88 V8 A4 4 0 0 1 8 4 Z" fill="rgb(236,238,252)" fill-opacity="0.27" fill-rule="evenodd"/>
